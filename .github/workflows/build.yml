name: 编译并发布

on:
  push:
    tags:
      - 'v*'          # 打 v1.0.0 这样的标签推送时，自动编译并发布 Release
  workflow_dispatch:   # 也可以在 Actions 页面手动触发，产物作为 Artifacts 保留

permissions:
  contents: write     # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 让产物文件名里的版本号和标签一致
      - name: 用标签版本号覆盖 package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 生成测试素材并跑功能自检
        run: |
          npm run gen-images
          npm run gen-anim
          npx electron . --smoke test/images/a_02_blue.png

      - name: 生成图标并编译
        run: |
          npm run make-icon
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 不做代码签名

      - name: 列出产物
        run: Get-ChildItem dist -File | Select-Object Name, Length

      - name: 上传编译产物（手动触发时）
        uses: actions/upload-artifact@v4
        with:
          name: SlideImageViewer-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 发布到 Release（打标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
          draft: false
